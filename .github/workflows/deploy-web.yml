# Every push to main that touches web/ redeploys the site to Cloudflare Workers.
# Posts don't need this — the site reads Supabase on each request — only code/design changes do.
name: deploy web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the Supabase values are public (RLS select-only) and live in .env.example
      - run: cp .env.example .env && echo "PUBLIC_CF_BEACON_TOKEN=${{ vars.CF_BEACON_TOKEN }}" >> .env
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
