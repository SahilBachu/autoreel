<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- placeholder profile picture: quiet dark disc, faint accent haze, a single hairline mark.
       replace by dropping a real square image in web/public/ and pointing config.ts at it. -->
  <defs>
    <radialGradient id="haze" cx="50%" cy="18%" r="70%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="256" height="256" fill="#0B0B0E"/>
    <rect width="256" height="256" fill="url(#haze)"/>
    <!-- hairline grid, masked -->
    <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
      <path d="M64 0v256M128 0v256M192 0v256M0 64h256M0 128h256M0 192h256"/>
    </g>
    <!-- the mark: a small filled circle with a soft ring, like a record-light -->
    <circle cx="128" cy="128" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <circle cx="128" cy="128" r="9" fill="#FAFAFA"/>
  </g>
</svg>
